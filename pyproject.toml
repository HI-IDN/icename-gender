[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icename-gender"
version = "0.1.0"
description = "Estimate gender from Icelandic names: patronymics and Þjóðskrá's name register"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Helga Ingimundardóttir" }]
dependencies = [
    "requests>=2.31",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/HI-IDN/icename-gender"
Issues = "https://github.com/HI-IDN/icename-gender/issues"

[project.scripts]
icename-gender = "icename_gender.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

# The register snapshot ships with the package, so classifying needs no network.
[tool.setuptools.package-data]
icename_gender = ["data/*.csv"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer.Option() in an argument default is how Typer declares CLI options.
# B008 flags it as a call in a default, which is exactly what it is meant to be.
"src/icename_gender/cli.py" = ["B008"]
